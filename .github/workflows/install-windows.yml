name: Install mxpy using pipx (Windows)

on:
  pull_request:
    branches: [ main, feat/* ]
  workflow_dispatch:

permissions:
  contents: read

env:
  REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  install:
    runs-on: windows-latest

    strategy:
      matrix:
        python-version: [ 3.11 ]

    steps:
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pipx
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pipx
          python -m pipx ensurepath

      - name: Install mxpy
        shell: pwsh
        run: |
          pipx install "git+https://github.com/$env:REPOSITORY.git@$env:BRANCH_NAME"

      - name: Smoke test
        shell: pwsh
        run: |
          mxpy --version
